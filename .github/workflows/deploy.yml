name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY_URL: registry-dev.k-paas.org
  PROJECT_NAME: kpaas/imagehub-dashboard
  KUBERNETES_NAMESPACE: imagehub-dashboard

jobs:
  # Build and test job
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run linter
      run: npm run lint
    
    - name: Build application
      run: npm run build
    
    - name: Run tests (if available)
      run: |
        if npm run test --dry-run 2>/dev/null; then
          npm run test
        else
          echo "No tests configured, skipping..."
        fi

  # Docker build and push job
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_URL }}/${{ env.PROJECT_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=sha-,format=short
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY_URL }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
        format: spdx-json
        output-file: sbom.spdx.json
    
    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.spdx.json

  # Security scanning
  security-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY_URL }}/${{ env.PROJECT_NAME }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy to development
  deploy-dev:
    needs: [docker-build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config current-context
    
    - name: Deploy to development
      env:
        KUBECONFIG: kubeconfig
        IMAGE_TAG: ${{ github.sha }}
        NAMESPACE: ${{ env.KUBERNETES_NAMESPACE }}-dev
      run: |
        chmod +x ./scripts/deploy.sh
        ./scripts/deploy.sh -n $NAMESPACE -t $IMAGE_TAG --skip-build
    
    - name: Verify deployment
      env:
        KUBECONFIG: kubeconfig
        NAMESPACE: ${{ env.KUBERNETES_NAMESPACE }}-dev
      run: |
        kubectl rollout status deployment/imagehub-dashboard -n $NAMESPACE --timeout=300s
        kubectl get pods -n $NAMESPACE
    
    - name: Run smoke tests
      env:
        KUBECONFIG: kubeconfig
        NAMESPACE: ${{ env.KUBERNETES_NAMESPACE }}-dev
      run: |
        # Get service endpoint
        SERVICE_IP=$(kubectl get service imagehub-dashboard-service -n $NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        if [ -z "$SERVICE_IP" ]; then
          SERVICE_IP=$(kubectl get service imagehub-dashboard-service -n $NAMESPACE -o jsonpath='{.spec.clusterIP}')
        fi
        
        # Wait for service to be ready
        echo "Testing health endpoint..."
        curl -f http://$SERVICE_IP/api/health || exit 1
        echo "Smoke tests passed!"

  # Deploy to staging
  deploy-staging:
    needs: [docker-build, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config current-context
    
    - name: Deploy to staging
      env:
        KUBECONFIG: kubeconfig
        IMAGE_TAG: ${{ github.sha }}
        NAMESPACE: ${{ env.KUBERNETES_NAMESPACE }}-staging
      run: |
        chmod +x ./scripts/deploy.sh
        ./scripts/deploy.sh -n $NAMESPACE -t $IMAGE_TAG --skip-build
    
    - name: Verify deployment
      env:
        KUBECONFIG: kubeconfig
        NAMESPACE: ${{ env.KUBERNETES_NAMESPACE }}-staging
      run: |
        kubectl rollout status deployment/imagehub-dashboard -n $NAMESPACE --timeout=300s
        kubectl get pods -n $NAMESPACE

  # Deploy to production
  deploy-production:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        kubectl config current-context
    
    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Deploy to production
      env:
        KUBECONFIG: kubeconfig
        IMAGE_TAG: ${{ steps.version.outputs.VERSION }}
        NAMESPACE: ${{ env.KUBERNETES_NAMESPACE }}
      run: |
        chmod +x ./scripts/deploy.sh
        ./scripts/deploy.sh -n $NAMESPACE -t $IMAGE_TAG --skip-build
    
    - name: Verify deployment
      env:
        KUBECONFIG: kubeconfig
        NAMESPACE: ${{ env.KUBERNETES_NAMESPACE }}
      run: |
        kubectl rollout status deployment/imagehub-dashboard -n $NAMESPACE --timeout=600s
        kubectl get pods -n $NAMESPACE
    
    - name: Create deployment notification
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}