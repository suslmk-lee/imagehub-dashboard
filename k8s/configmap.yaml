apiVersion: v1
kind: ConfigMap
metadata:
  name: imagehub-dashboard-config
  namespace: imagehub-dashboard
  labels:
    app: imagehub-dashboard
data:
  # Application configuration
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  
  # KeyCloak configuration (adjust these values for your environment)
  KEYCLOAK_URL: "https://registry-keycloak.k-paas.org"
  KEYCLOAK_REALM: "cp-realm"
  KEYCLOAK_CLIENT_ID: "cp-client"
  
  # Additional app-specific settings
  APP_NAME: "ImageHub Dashboard"
  APP_VERSION: "1.0.0"
  
  # Security settings
  ALLOWED_ORIGINS: "https://harbor.27.96.159.239.nip.io,https://portal.133.186.152.47.nip.io,https://hub.133.186.152.47.nip.io"
---
# Secret for sensitive data (create this separately with actual values)
apiVersion: v1
kind: Secret
metadata:
  name: imagehub-dashboard-secrets
  namespace: imagehub-dashboard
  labels:
    app: imagehub-dashboard
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets
  # Example: echo -n "your-secret-value" | base64
  keycloak-client-secret: ""  # Add your actual client secret here
  session-secret: ""          # Add your session secret here
  jwt-secret: ""              # Add your JWT secret here