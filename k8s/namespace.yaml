apiVersion: v1
kind: Namespace
metadata:
  name: imagehub-dashboard
  labels:
    name: imagehub-dashboard
    app: imagehub-dashboard
---
# Resource quota for the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: imagehub-dashboard-quota
  namespace: imagehub-dashboard
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "2"
    pods: "10"
    services: "5"
---
# Limit range for default resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: imagehub-dashboard-limits
  namespace: imagehub-dashboard
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    type: Container