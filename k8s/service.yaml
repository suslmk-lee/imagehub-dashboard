apiVersion: v1
kind: Service
metadata:
  name: imagehub-dashboard-service
  namespace: imagehub-dashboard
  labels:
    app: imagehub-dashboard
    service-type: web
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  selector:
    app: imagehub-dashboard
  sessionAffinity: None
---
# Headless service for StatefulSet (if needed in the future)
apiVersion: v1
kind: Service
metadata:
  name: imagehub-dashboard-headless
  namespace: imagehub-dashboard
  labels:
    app: imagehub-dashboard
    service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
  selector:
    app: imagehub-dashboard
---
