apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: imagehub-dashboard-hpa
  namespace: imagehub-dashboard
  labels:
    app: imagehub-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: imagehub-dashboard
  
  # Scaling configuration
  minReplicas: 2
  maxReplicas: 10
  
  # Scaling metrics
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metrics (uncomment if you have custom metrics)
  # - type: Pods
  #   pods:
  #     metric:
  #       name: http_requests_per_second
  #     target:
  #       type: AverageValue
  #       averageValue: "100"
  
  # External metrics (uncomment if you have external metrics like from Prometheus)
  # - type: External
  #   external:
  #     metric:
  #       name: nginx_ingress_controller_requests_rate
  #       selector:
  #         matchLabels:
  #           ingress: imagehub-dashboard-ingress
  #     target:
  #       type: Value
  #       value: "100"
  
  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60   # 1 minute
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
---
# Vertical Pod Autoscaler (optional, requires VPA controller)
