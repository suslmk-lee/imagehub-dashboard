apiVersion: v1
kind: ConfigMap
metadata:
  name: imagehub-dashboard-config
  namespace: kps-hub
  labels:
    app: imagehub-dashboard
    version: "1.0.0"
data:
  # Application settings
  NODE_ENV: "production"
  PORT: "3000"
  
  # Next.js settings
  NEXT_PUBLIC_APP_NAME: "ImageHub Dashboard"
  NEXT_PUBLIC_APP_VERSION: "1.0.0"
  
  # KeyCloak integration settings
  NEXT_PUBLIC_KEYCLOAK_URL: "https://portal.133.186.152.47.nip.io/auth"
  NEXT_PUBLIC_KEYCLOAK_REALM: "k-paas"
  NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "imagehub-dashboard"
  
  # Application metadata
  APP_NAME: "ImageHub Dashboard"
  APP_VERSION: "1.0.0"
  
  # Security settings - Updated for kps-hub namespace
  ALLOWED_ORIGINS: "https://hub.27.96.159.239.nip.io,https://harbor.27.96.159.239.nip.io,https://portal.133.186.152.47.nip.io"
---
# Secret for sensitive data (create this separately with actual values)
