apiVersion: v1
kind: Service
metadata:
  name: imagehub-dashboard-service
  namespace: kps-hub
  labels:
    app: imagehub-dashboard
    version: "1.0.0"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  selector:
    app: imagehub-dashboard
  
  # Session affinity for sticky sessions (optional)
  sessionAffinity: None
---
# Headless service for direct pod access (optional)
apiVersion: v1
kind: Service
metadata:
  name: imagehub-dashboard-headless
  namespace: kps-hub
  labels:
    app: imagehub-dashboard
    service-type: headless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
  selector:
    app: imagehub-dashboard