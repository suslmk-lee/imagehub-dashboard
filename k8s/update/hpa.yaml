# Horizontal Pod Autoscaler for imagehub-dashboard in kps-hub namespace
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: imagehub-dashboard-hpa
  namespace: kps-hub
  labels:
    app: imagehub-dashboard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: imagehub-dashboard
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max
---
# Pod Disruption Budget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: imagehub-dashboard-pdb
  namespace: kps-hub
  labels:
    app: imagehub-dashboard
spec:
  selector:
    matchLabels:
      app: imagehub-dashboard
  minAvailable: 1